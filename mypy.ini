[mypy]
exclude = ^\.venv/

# The assigned maze-generator wheel ships no type stubs / py.typed
# marker (subject V.4: used as-is, never vendored). Silence the
# missing-import error in one place so both `make lint` and
# `make lint-strict` stay clean without scattering per-line ignores
# (which --warn-unused-ignores would then flag under the plain lint).
[mypy-mazegenerator.*]
ignore_missing_imports = True

# The MiniLibX Python wrapper (mlx_CLXV) ships no type stubs / py.typed
# marker either; same treatment so both lint gates stay clean.
[mypy-mlx.*]
ignore_missing_imports = True
